name: Decimaly daily content

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily content script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/daily-content.mjs

      - name: Commit updated keyword history
        run: |
          git config user.name "decimaly-bot"
          git config user.email "actions@github.com"
          git add data/keyword-history.json
          git diff --staged --quiet || git commit -m "Update keyword history"
          git push
